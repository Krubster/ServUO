# BotWatch: player activity profiling used to spot scout bots.
# Observe-only: it records what characters do and never acts on players.

# Master switch.
Enabled=True

# How often online characters are scanned for encounters, teleporter presence
# and ghost time.
ScanInterval=00:00:02

# Names of the safe towns, separated by ';'. Nothing done inside them counts as
# an encounter, teleporter presence or ghost time. Leave empty to treat every
# guarded region as a town.
TownRegions=

# An encounter is another player coming into view. The same pair of characters
# counts again only after this cooldown.
EncounterCooldown=00:10:00

# An encounter is "idle" when the character did nothing meaningful (PvM, PvP,
# crafting, gathering, trading) within this window before or after it.
IdleWindow=00:05:00

# Time after an encounter in which attacking the other player, or moving at
# least ReactionMoveTiles away from where the character stood, counts as a
# reaction.
ReactionWindow=00:00:30
ReactionMoveTiles=8

# Teleporters and moongates (found automatically). Idle time within
# TeleporterRange tiles counts once the character has been near one for longer
# than TeleporterGrace without a meaningful action.
TeleporterRange=12
TeleporterGrace=00:02:00

# How long hourly activity buckets and the session log are kept.
ActivityRetention=30.00:00:00
SessionRetention=90.00:00:00

# --- Ratings and profiles ([Profile, [Profiles) ---

# Period the ratings cover.
RatingWindow=7.00:00:00

# Characters with less time online than this in the window still get a profile,
# but are not used as the comparison group for activity ratings.
MinOnlineHours=1.0

# Minimum data before the encounter-based and session-based parts of the scores
# are used.
MinEncounters=5
MinSessions=3

# Scout pattern: Watch at or above ScoutWatchThreshold while PvM, PvP, crafting,
# gathering and trade ratings are all at or below ScoutActivityCeiling.
ScoutWatchThreshold=60
ScoutActivityCeiling=25

# Session scores at or above this are shown in red.
SessionThreshold=60

# Watch and Session are only computed when the parts with enough data carry at
# least this share of the total weight, so a single signal cannot decide.
MinScoreWeight=0.5

# Session score inputs: a login within RelogGap of the previous logout is a
# relog; sessions up to ShortSession long outside towns without meaningful
# actions count as short idle sessions; accounts and characters younger than
# FreshDays and characters under LowSkills total skill count as disposable.
RelogGap=00:05:00
ShortSession=00:15:00
FreshDays=7
LowSkills=200

# --- Account networks ([Network, [Networks) and alerts ([BWAlerts) ---

# Two accounts are linked when they shared an IP, or when at least
# CoPresenceMin of their sessions started and ended within CoPresenceWindow of
# each other (this catches accounts behind different IPs or proxies).
CoPresenceWindow=00:01:00
CoPresenceMin=3

# Alert when a character of an account or character younger than FreshDays has
# spent this long outside towns in one session without a meaningful action.
FreshIdleAlert=00:20:00

# How often fresh characters are checked for the Watch pattern.
AlertCheckInterval=00:30:00

# The same alert for the same character or account is not repeated within this
# period. Alerts are kept as long as sessions (SessionRetention).
AlertRepeat=1.00:00:00

# --- Flags ([Flags) and player reports ([ReportScout) ---

# An open flag gets a new evidence snapshot at most this often (up to 5 are
# kept: the first and the latest four). Snapshots are also written to
# Logs/BotWatch/Evidence.
SnapshotInterval=1.00:00:00

# A character set to "Legit" is not flagged again for this long.
LegitQuietPeriod=14.00:00:00

# [ReportScout limits: reports per account per day, how often the same
# character may be reported by the same account, and the minimum account age.
ReportsPerDay=3
ReportTargetCooldown=1.00:00:00
ReportMinAccountAge=3.00:00:00

# A character is flagged once this many different accounts reported it within
# the rating window.
ReportFlagThreshold=3

# --- Guild reactions: tying scouts to the guild that uses them ---

# After each idle encounter, BotWatch checks which guilds had a member farther
# than GuildFarRange tiles away (or offline) at that moment who came within
# GuildNearRange tiles of the spot within GuildResponseWindow. The same check
# at GuildBaselineSamples random moments gives each guild's usual rate there.
# A guild is reported once it arrived after at least GuildMinResponses idle
# encounters at GuildMinLift times its usual rate.
GuildReactions=True
GuildResponseWindow=00:10:00
GuildNearRange=24
GuildFarRange=60
GuildBaselineSamples=3
GuildMinResponses=5
GuildMinLift=3.0

# Positions of online players are sampled this often and kept in memory only
# for TrailLength (needed for the baseline).
TrailSampleInterval=00:00:30
TrailLength=03:00:00

# --- Information denial (optional, off by default) ---

# When on, characters with the scout pattern and Watch at or above
# InfoDenialWatch stop receiving other players after InfoDenialIdle outside
# towns without a meaningful action. Any meaningful action restores sight at
# once. Guildmates, allies, party members and the character's own account stay
# visible; characters whose latest flag is "Legit" are never affected.
InfoDenial=False
InfoDenialWatch=70
InfoDenialIdle=00:05:00
